<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Loop · Purple Framework</title>
  <link rel="stylesheet" href="/panel.css">
  <style>
    .loop-page{min-height:100vh;display:grid;place-items:center;padding:24px;background:var(--md-sys-color-surface)}
    .loop-stage{width:min(920px,100%);min-height:600px;display:grid;grid-template-columns:1.1fr .9fr;overflow:hidden;border-radius:48px;background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container)}
    .loop-copy{padding:clamp(32px,7vw,80px);display:flex;flex-direction:column;justify-content:space-between}.loop-copy h1{font-size:clamp(64px,13vw,144px);letter-spacing:-.09em}.loop-copy p{max-width:440px;line-height:1.7}.back{align-self:flex-start;display:inline-flex;min-height:44px;align-items:center;padding:0 19px;border-radius:999px;background:var(--md-sys-color-primary);color:var(--md-sys-color-on-primary);text-decoration:none;font-weight:650}
    .canvas{position:relative;min-height:500px;background:var(--md-sys-color-on-primary-container);color:var(--md-sys-color-primary-container);display:grid;place-items:center;overflow:hidden}.canvas::before,.canvas::after{content:"";position:absolute;border:1px solid currentColor;border-radius:50%;opacity:.3}.canvas::before{width:70%;aspect-ratio:1}.canvas::after{width:42%;aspect-ratio:1}.node{position:relative;z-index:1;width:92px;height:92px;display:grid;place-items:center;border-radius:30px 30px 12px 30px;background:var(--md-sys-color-primary-container);color:var(--md-sys-color-on-primary-container);font:700 28px ui-monospace,Consolas,monospace}.note{position:absolute;bottom:30px;left:30px;right:30px;font:12px/1.6 ui-monospace,Consolas,monospace;opacity:.7}
    @media(max-width:720px){.loop-stage{grid-template-columns:1fr;border-radius:32px}.canvas{min-height:360px}.loop-copy{min-height:430px}.loop-copy h1{font-size:78px}}
  </style>
</head>
<body class="loop-page">
  <main class="loop-stage">
    <section class="loop-copy">
      <a class="back" href="/">返回 Panel</a>
      <div><span class="eyebrow">Web development environment</span><h1>Loop</h1><p>这里是面向插件作者的类 Scratch Web 开发环境入口。当前保留工作区壳层，后续可接入可视化积木、实时预览与发布流程。</p></div>
    </section>
    <section class="canvas" aria-label="Loop 工作区占位预览">
      <div class="node">{ }</div>
      <div class="note">workspace.status = reserved<br>runtime.bridge = planned<br>visual.blocks = planned</div>
    </section>
  </main>
</body>
</html>
